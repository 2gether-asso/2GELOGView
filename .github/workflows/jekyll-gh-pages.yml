# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  schedule:
    # Régénère les pages d'aperçu Discord/Twitter (/e/*.html, voir scripts/generate-embeds.js)
    # et le flux .ics abonnable toutes les heures : le tableur Google Sheet change en continu
    # sans passer par un push git.
    - cron: "0 * * * *"
    # Digest hebdomadaire Discord (scripts/post-discord-digest.js), le lundi matin - repéré via
    # github.event.schedule dans le step ci-dessous pour ne PAS se déclencher à chaque run horaire.
    - cron: "0 8 * * 1"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate Discord/Twitter preview pages and live .ics feed
        # Ne doit jamais bloquer le déploiement du reste du site (ex: Google Sheet
        # momentanément injoignable) : un aperçu ou un flux .ics manquant est un défaut
        # mineur, pas une raison de ne pas publier les vraies mises à jour de l'app.
        continue-on-error: true
        run: |
          npm install
          npm run generate:embeds
          npm run generate:ics
      - name: Post weekly Discord digest
        # Ne se déclenche QUE sur le cron du lundi matin (pas le cron horaire ci-dessus) ou un
        # lancement manuel (pratique pour tester) - jamais à chaque run horaire, sinon spam.
        if: github.event.schedule == '0 8 * * 1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run post:discord-digest
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
